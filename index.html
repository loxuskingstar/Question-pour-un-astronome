<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions pour un Astronome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Lien vers le CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header id="main-header" class="header-hidden">
        <img src="logo.png" alt="Logo" class="logo">
        <div class="scoreboard" id="scoreboard"></div>
    </header>

    <main id="main-content"></main>

    <!-- Fenêtre Pop-up de Buzz -->
    <div id="buzz-popup" class="glass-panel" style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100; padding: 25px 50px; border-radius: 30px; text-align: center; flex-direction: column; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9); border: 2px solid var(--accent-color); background: rgba(25, 22, 49, 0.95);">
        <h2 style="font-size: 2rem; margin-bottom: 5px; margin-top: 0;">🚨 BZZZ !</h2>
        <div id="buzz-team-name" style="font-size: 3.5rem; color: var(--accent-color); font-family: 'Chau Philomene One'; margin-bottom: 20px;">Equipe</div>
        
        <div style="display: flex; gap: 20px; justify-content: center;">
            <button class="btn-success" onclick="resolveBuzz(true)" style="font-size: 1.2rem; padding: 15px 30px;">✅ Vrai</button>
            <button class="btn-danger" onclick="resolveBuzz(false)" style="font-size: 1.2rem; padding: 15px 30px;">❌ Faux</button>
        </div>
    </div>

    <button id="btn-skip-question" class="btn-accent" onclick="skipQuestion()" style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 50; font-size: 1.5rem; padding: 15px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">Passer à la question suivante ➔</button>
    
    <!-- ORDRE DES SCRIPTS TRÈS IMPORTANT -->
    <button id="btn-settings-toggle" onclick="toggleSettings()" style="display: none; position: fixed; bottom: 25px; left: 25px; z-index: 90; padding: 12px 20px; border-radius: 15px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; font-size: 1.2rem; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">⚙️ Paramètres</button>

    <div id="settings-popup" class="glass-panel" style="display: none; position: fixed; bottom: 85px; left: 25px; z-index: 90; padding: 25px; border-radius: 20px; flex-direction: column; gap: 15px; background: rgba(11, 9, 20, 0.95); border: 2px solid var(--accent-color);">
        <h3 style="margin: 0 0 10px 0; color: var(--accent-color); font-size: 1.4rem;">Nombre de questions</h3>
        <label style="display: flex; justify-content: space-between; align-items: center; width: 220px; font-size: 1.2rem;">Phase 1: <input type="number" id="cfg-p1" value="15" min="3" style="width: 70px; padding: 8px; margin: 0;"></label>
        <label style="display: flex; justify-content: space-between; align-items: center; width: 220px; font-size: 1.2rem;">Phase 2: <input type="number" id="cfg-p2" value="5" min="3" style="width: 70px; padding: 8px; margin: 0;"></label>
        <label style="display: flex; justify-content: space-between; align-items: center; width: 220px; font-size: 1.2rem;">Phase 3: <input type="number" id="cfg-p3" value="5" min="3" style="width: 70px; padding: 8px; margin: 0;"></label>
    </div>
    <!-- 1. Librairies externes -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <!-- 2. Données et Réseau -->
    <script src="questions.js"></script>
    <script src="teams.js"></script>
    <script src="network.js"></script>
    
    <!-- 3. Logique principale de l'écran (le nouveau fichier que tu viens de créer) -->
    <script src="index.js"></script>

</body>
</html>
