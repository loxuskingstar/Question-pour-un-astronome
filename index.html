<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions pour un Astronome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #191631; /* Fond uni */
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --accent-color: #f7b731;
            --accent-glow: rgba(247, 183, 49, 0.4);
            --success-color: #00b894;
            --danger-color: #ff7675;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Josefin Sans', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- CLASSE GLOBALE GLASSMORPHISME --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255,255,255,0.02);
        }

        h1, h2, h3, .podium-step span {
            font-family: 'Chau Philomene One', sans-serif;
            font-weight: 400;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
            margin: 20px 40px 10px 40px;
            background: rgba(25, 22, 49, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 10;
            position: sticky;
            top: 20px;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .header-hidden {
            opacity: 0;
            transform: translateY(-100px);
            pointer-events: none;
        }

        .logo {
            max-height: 65px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
            transition: transform 0.4s ease;
        }
        .logo:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        /* --- SCOREBOARD FLIP ANIMATION --- */
        .scoreboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            max-width: 70vw;
        }
        .team-score {
            border-radius: 30px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1; 
        }
        .team-header-name {
            max-width: 120px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
        }
        .team-header-pts {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1.4rem;
            white-space: nowrap;
        }

        main {
            flex-grow: 1;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
        }
        .home-logo {
            max-width: 80vw;
            max-height: 350px;
            margin-bottom: 60px;
            animation: floatLogo 4s ease-in-out infinite;
        }
        @keyframes floatLogo {
            0% { transform: translateY(0); filter: drop-shadow(0 0 10px rgba(247, 183, 49, 0.1)); }
            50% { transform: translateY(-15px); filter: drop-shadow(0 0 20px rgba(247, 183, 49, 0.25)); }
            100% { transform: translateY(0); filter: drop-shadow(0 0 10px rgba(247, 183, 49, 0.1)); }
        }

        .animate-enter {
            animation: fadeSlideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.8rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 25px rgba(255,255,255,0.2);
            word-break: break-word;
            max-width: 95vw;
        }

        h2 { font-size: 2.5rem; text-align: center; margin-bottom: 30px; word-break: break-word; }
        h3 { font-size: 2rem; color: var(--accent-color); margin-top: 0; margin-bottom: 15px; }

        button {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: 'Josefin Sans', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 100%;
        }
        button:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.4);
        }
        button:active { transform: translateY(1px); }
        
        button.btn-accent {
            background: var(--accent-color);
            color: #0b0914;
            border: none;
            box-shadow: 0 0 20px var(--accent-glow);
            font-weight: 700;
        }
        button.btn-accent:hover {
            background: #ffc954;
            box-shadow: 0 0 35px var(--accent-glow);
            border: none;
        }
        
        input {
            padding: 15px 25px;
            font-size: 1.2rem;
            font-family: 'Josefin Sans', sans-serif;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            background: rgba(0,0,0,0.4);
            color: white;
            margin-right: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            backdrop-filter: blur(5px);
            max-width: 100%;
        }
        input:focus { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .rules-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            max-width: 1500px;
            width: 92%;
        }
        @media (max-width: 1100px) {
            .rules-grid { grid-template-columns: 1fr; max-width: 600px; }
        }
        .rule-card {
            padding: 35px;
            border-radius: 25px;
        }
        .rule-card ul {
            padding-left: 20px;
            line-height: 1.8;
            font-size: 1.2rem;
            color: #e0e0e0;
        }

        .team-announcement {
            font-size: 4.5rem;
            font-family: 'Chau Philomene One', sans-serif;
            color: var(--accent-color);
            text-align: center;
            word-break: break-word;
            max-width: 90vw;
            animation: popInAndGlowTeam 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes popInAndGlowTeam {
            0% { opacity: 0; transform: scale(0.8); text-shadow: 0 0 0 rgba(247, 183, 49, 0); filter: blur(5px); }
            20% { opacity: 1; transform: scale(1.1); text-shadow: 0 0 40px rgba(247, 183, 49, 0.8); filter: blur(0); }
            80% { opacity: 1; transform: scale(1); text-shadow: 0 0 30px rgba(247, 183, 49, 0.6); filter: blur(0); }
            100% { opacity: 0; transform: scale(0.9); filter: blur(2px); }
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Retour aux 4 colonnes */
            gap: 25px;
            max-width: 1600px;
            width: 95%;
        }
        .category-btn {
            height: 140px;
            font-size: 1.3rem;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            line-height: 1.3;
        }
        .category-btn.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .question-box {
            padding: 50px;
            border-radius: 30px;
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-bottom: 35px;
            font-size: 1.8rem;
            font-weight: 400;
            line-height: 1.5;
        }
        
        .answer-box {
            color: var(--accent-color);
            margin-top: 30px;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .answer-box.visible {
            opacity: 1;
            max-height: 400px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        .answer-main {
            font-weight: 700;
            font-size: 2.4rem;
        }
        .answer-desc {
            font-size: 1.3rem;
            font-weight: 300;
            font-family: 'Josefin Sans', sans-serif;
            color: #dcdcdc;
            margin-top: 15px;
            line-height: 1.4;
            font-style: italic;
            opacity: 0.9;
        }

        .btn-reveal-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease forwards;
        }
        .action-area.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .team-btn-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }
        .team-btn-container button {
            flex: 0 1 calc(20% - 12px);
            min-width: 140px;
            margin: 0; 
            padding: 12px 15px;
            font-size: 1.1rem;
            white-space: normal;
            word-break: break-word;
            line-height: 1.3;
        }
        @media (max-width: 900px) {
            .team-btn-container button { flex: 0 1 calc(33.33% - 12px); }
        }
        @media (max-width: 600px) {
            .team-btn-container button { flex: 0 1 calc(50% - 12px); }
        }

        @keyframes flashGreen {
            0% { transform: scale(1); }
            50% { background: rgba(0, 184, 148, 0.5); border-color: rgba(0, 184, 148, 0.8); box-shadow: 0 0 15px rgba(0, 184, 148, 0.4); transform: scale(1.02); color: white; }
            100% { background: rgba(0, 184, 148, 0.7); border-color: rgba(0, 184, 148, 0.9); box-shadow: 0 0 10px rgba(0, 184, 148, 0.3); transform: scale(1); color: white; }
        }
        .correct-flash {
            animation: flashGreen 0.4s ease-out forwards !important;
            pointer-events: none;
        }

        #p3-question-text {
            min-height: 100px;
            text-align: center;
            line-height: 1.6;
        }
        .p3-letter {
            opacity: 0;
            display: inline-block;
            white-space: pre-wrap;
            transform: translateY(10px) scale(0.9);
            filter: blur(4px);
            transition: opacity 0.15s ease-out, transform 0.15s ease-out, filter 0.15s ease-out;
        }
        .p3-letter.revealed {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        /* --- PODIUM ET CLASSEMENT --- */
        .podium-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
            height: 380px; 
            margin-top: 40px;
            width: 100%;
        }
        .podium-step {
            width: 200px;
            text-align: center;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 30px 10px 15px 10px;
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 700;
            color: #0b0914;
            height: 0; 
            transition: height 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
        }
        
        .podium-step span.podium-rank {
            font-family: 'Chau Philomene One', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 5px;
            position: relative;
            z-index: 2;
        }
        
        .podium-names {
            font-size: 1.4rem;
            line-height: 1.3;
            margin: 10px 0;
            word-break: break-word;
            padding: 0 5px;
        }

        .podium-points {
            font-size: 1.3rem; 
            font-weight: 600; 
            font-family: 'Josefin Sans'; 
            opacity: 0.9; 
            margin-top: auto;
        }
        
        .p-1 span.podium-rank::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 120px; height: 100px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 215, 0, 0.5) 40%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(8px);
        }
        .p-1 span.podium-rank { text-shadow: 0 0 12px rgba(255, 255, 255, 0.6); }
        
        .p-1 { background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%); z-index: 3; box-shadow: 0 -10px 50px rgba(255, 215, 0, 0.4); }
        .p-2 { background: linear-gradient(135deg, #e0e0e0 0%, #a0a0a0 100%); z-index: 2; box-shadow: 0 -10px 40px rgba(224, 224, 224, 0.2); }
        .p-3 { background: linear-gradient(135deg, #cd7f32 0%, #8b4513 100%); z-index: 1; box-shadow: 0 -10px 40px rgba(205, 127, 50, 0.2); }

        .leaderboard-list {
            margin-top: 50px;
            width: 100%;
            max-width: 650px;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }
        .leaderboard-row {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 15px 25px;
            border-radius: 12px;
            transition: transform 0.2s ease, background 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }
        .leaderboard-row:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .rank-badge {
            font-family: 'Chau Philomene One', sans-serif;
            color: var(--text-color);
            opacity: 0.6;
            font-size: 1.8rem;
            min-width: 65px;
            text-align: right;
        }
        .team-name-lb {
            flex-grow: 1;
            font-weight: 600;
            font-size: 1.5rem;
            word-break: break-word;
            padding-right: 15px;
        }
        .team-score-lb {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--accent-color);
            min-width: 60px;
            text-align: right;
            text-shadow: 0 0 10px rgba(247, 183, 49, 0.3);
        }
        
        .export-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .btn-success { background-color: rgba(0, 184, 148, 0.2); border-color: var(--success-color); color: var(--success-color); }
        .btn-success:hover { background-color: var(--success-color); color: #fff; box-shadow: 0 0 20px rgba(0,184,148,0.5); border-color:transparent;}
        .btn-danger { background-color: rgba(255, 118, 117, 0.2); border-color: var(--danger-color); color: var(--danger-color); }
        .btn-danger:hover { background-color: var(--danger-color); color: #fff; box-shadow: 0 0 20px rgba(255,118,117,0.5); border-color:transparent;}
    </style>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="questions.js"></script>
    <script src="teams.js"></script>
    <script src="network.js"></script>
</head>
<body>

    <header id="main-header" class="header-hidden">
        <img src="logo.png" alt="Logo" class="logo">
        <div class="scoreboard" id="scoreboard"></div>
    </header>

    <main id="main-content">
    </main>

    <!-- Fenêtre Pop-up de Buzz (Placée en bas pour ne pas cacher la question) -->
    <div id="buzz-popup" class="glass-panel" style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100; padding: 25px 50px; border-radius: 30px; text-align: center; flex-direction: column; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9); border: 2px solid var(--accent-color); background: rgba(25, 22, 49, 0.95);">
        <h2 style="font-size: 2rem; margin-bottom: 5px; margin-top: 0;">🚨 BZZZ !</h2>
        <div id="buzz-team-name" style="font-size: 3.5rem; color: var(--accent-color); font-family: 'Chau Philomene One'; margin-bottom: 20px;">Equipe</div>
        
        <div style="display: flex; gap: 20px; justify-content: center;">
            <button class="btn-success" onclick="resolveBuzz(true)" style="font-size: 1.2rem; padding: 15px 30px;">✅ Vrai</button>
            <button class="btn-danger" onclick="resolveBuzz(false)" style="font-size: 1.2rem; padding: 15px 30px;">❌ Faux</button>
        </div>
    </div>

    <!-- Bouton "Passer à la question suivante" (Centré en bas) -->
    <button id="btn-skip-question" class="btn-accent" onclick="skipQuestion()" style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 50; font-size: 1.5rem; padding: 15px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">Passer à la question suivante ➔</button>
    
    <script>
        let QUESTIONS;

        window.onload = function() {
            if (!window.QUESTIONS) {
                document.getElementById('main-content').innerHTML = `
                    <h1 style="color: var(--danger-color); text-shadow: none; font-size: 4rem;">Erreur de chargement</h1>
                    <div class="glass-panel" style="padding: 40px; border-radius: 20px; text-align: center; max-width: 800px;">
                        <p style="font-size: 1.8rem; margin-bottom: 20px;">Impossible de lire le fichier <strong>questions.js</strong> !</p>
                        <p style="opacity: 0.8; font-size: 1.2rem; line-height: 1.6;">
                            Vérifie que :<br>
                            1. Le fichier <strong>questions.js</strong> est bien dans le même dossier que ce fichier HTML.<br>
                            2. Tu as bien <strong>sauvegardé</strong> les deux fichiers dans ton éditeur de code.<br>
                            3. Il n'y a pas d'erreur de ponctuation (virgule manquante, guillemet oublié) dans ton fichier de questions.
                        </p>
                    </div>
                `;
                return;
            }
            
            QUESTIONS = window.QUESTIONS;
            showHome();
        };

        let currentPhase = ''; 
        let currentQuestionIndex = 0;
        let activeCategory = '';
        let activeTeamIndex = -1;
        let categoriesDone = [];
        
        let phase2Order = []; 
        let phase2Turn = 0;   

        let p3RevealInterval = null;
        let p3FullText = "";
        let p3CurrentIndex = 0;

        const mainContent = document.getElementById('main-content');
        const scoreboard = document.getElementById('scoreboard');
        const header = document.getElementById('main-header');

        document.addEventListener('keydown', (e) => {
            // AJOUT : on vérifie que personne n'a la main (!currentBuzzedTeam)
            if (currentPhase === 'p3_q' && e.code === 'Space' && !currentBuzzedTeam) {
                e.preventDefault(); 
                if (!p3RevealInterval && p3CurrentIndex < p3FullText.length) {
                    p3RevealInterval = setInterval(() => {
                        if (p3CurrentIndex < p3FullText.length) {
                            const spanLetter = document.getElementById(`p3-l-${p3CurrentIndex}`);
                            if(spanLetter) spanLetter.classList.add('revealed');
                            p3CurrentIndex++;
                        } else {
                            clearInterval(p3RevealInterval);
                            p3RevealInterval = null;
                        }
                    }, 60); // Vitesse apparition - Phase 3
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (currentPhase === 'p3_q' && e.code === 'Space') {
                e.preventDefault();
                if (p3RevealInterval) {
                    clearInterval(p3RevealInterval);
                    p3RevealInterval = null;
                }
            }
        });

        function updateScoreboard() {
            const oldPositions = {};
            Array.from(scoreboard.children).forEach(el => {
                const name = el.getAttribute('data-team');
                oldPositions[name] = el.getBoundingClientRect();
            });

            const sortedTeams = [...teams].sort((a, b) => b.score - a.score);

            scoreboard.innerHTML = '';
            sortedTeams.forEach(team => {
                const teamDiv = document.createElement('div');
                teamDiv.className = 'team-score glass-panel';
                teamDiv.setAttribute('data-team', team.name); 
                teamDiv.innerHTML = `<span class="team-header-name" title="${team.name}">${team.emoji} ${team.name}</span> <span class="team-header-pts">${team.score} pts</span>`;
                scoreboard.appendChild(teamDiv);
            });

            Array.from(scoreboard.children).forEach(el => {
                const name = el.getAttribute('data-team');
                const oldRect = oldPositions[name];
                
                if (oldRect) {
                    const newRect = el.getBoundingClientRect();
                    const deltaX = oldRect.left - newRect.left;
                    const deltaY = oldRect.top - newRect.top;

                    if (deltaX !== 0 || deltaY !== 0) {
                        el.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                        el.style.transition = 'none';

                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                el.style.transform = '';
                                el.style.transition = 'transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                                
                                setTimeout(() => {
                                    el.style.transition = '';
                                }, 800);
                            });
                        });
                    }
                }
            });
        }

        function exportResults() {
            let content = "=========================================\n";
            content += "  RÉSULTATS : QUESTIONS POUR UN ASTRONOME\n";
            content += "=========================================\n\n";

            content += "--- CLASSEMENT FINAL ---\n";
            
            let allRankedTeams = [...teams].sort((a, b) => b.score - a.score);
            let currentRank = 1;
            for(let i=0; i<allRankedTeams.length; i++) {
                if(i > 0 && allRankedTeams[i].score < allRankedTeams[i-1].score) {
                    currentRank++; 
                }
                content += `${currentRank}. ${allRankedTeams[i].emoji} ${allRankedTeams[i].name} - ${allRankedTeams[i].score} pts\n`;
            }

            content += "\n=========================================\n";
            content += "  QUESTIONS & RÉPONSES DU JEU\n";
            content += "=========================================\n\n";

            content += "--- QUALIFICATIONS (Phase 1) ---\n";
            QUESTIONS.phase1.forEach((q, i) => {
                content += `Q${i+1} (${q.pts} pts): ${q.q}\nR: ${q.a}\n`;
                if(q.d) content += `> ${q.d}\n`;
                content += `\n`;
            });

            content += "--- A LA CARTE (Phase 2) ---\n";
            Object.keys(QUESTIONS.phase2).forEach(cat => {
                content += `\n[ Thème : ${cat} ]\n`;
                QUESTIONS.phase2[cat].forEach((q, i) => {
                    content += `Q${i+1} (${q.pts} pts): ${q.q}\nR: ${q.a}\n`;
                    if(q.d) content += `> ${q.d}\n`;
                    content += `\n`;
                });
            });

            content += "--- LE JEU DECISIF (Phase 3) ---\n";
            QUESTIONS.phase3.forEach((q, i) => {
                content += `Q${i+1} (${q.pts} pts): ${q.q}\nR: ${q.a}\n`;
                if(q.d) content += `> ${q.d}\n`;
                content += `\n`;
            });

            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Resultats_Astronomie.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

                    connections[teamName].send({ type: 'lock', winner: 'Écoutez bien...' });

        function handleActiveTeamAnswer(isCorrect) {
            // On cache les boutons de contrôle direct
            document.getElementById('active-team-controls').style.display = 'none';
            
            // On récupère le vrai NOM de l'équipe active
            let activeTeamName = teams[activeTeamIndex].name;
            
            if (isCorrect) {
                // 1. Ils ont bon : on donne les points (avec le NOM) et on passe à la suite
                addPoints(activeTeamName, getCurrentQuestionPoints());
                revealAnswer();
                lockAllBuzzers();
            } else {
                // 2. Ils ont faux : ON OUVRE LE VOL AUX AUTRES !
                getTeam(activeTeamName).blocked = true; // Bloque l'équipe active

        function renderPhase3Question() {

        function showPodium() {
            currentPhase = 'podium';
            
            let allRankedTeams = [...teams].sort((a, b) => b.score - a.score);
            let rank = 1;
            for(let i=0; i<allRankedTeams.length; i++) {
                if(i > 0 && allRankedTeams[i].score < allRankedTeams[i-1].score) {
                    rank++; 
                }
                allRankedTeams[i].rank = rank;
            }

            let uniqueScores = [...new Set(teams.map(t => t.score))].sort((a, b) => b - a);

            let podium1 = allRankedTeams.filter(t => t.score === uniqueScores[0]);
            let podium2 = uniqueScores.length > 1 ? allRankedTeams.filter(t => t.score === uniqueScores[1]) : [];
            let podium3 = uniqueScores.length > 2 ? allRankedTeams.filter(t => t.score === uniqueScores[2]) : [];

            const formatNames = (tms) => tms.map(t => `${t.emoji} ${t.name}`).join('<br>');

            let html = `<h1 style="margin-bottom: 10px;">Classement Final</h1>
                        <div class="podium-container">`;

            if(podium2.length > 0) {
                let rank2 = podium2[0].rank;
                html += `
                    <div class="podium-step p-2" id="pod-2">
                        <span class="podium-rank">${rank2 === 1 ? '1er' : rank2 + 'ème'}</span>
                        <div class="podium-names">${formatNames(podium2)}</div>
                        <span class="podium-points">${podium2[0].score} pts</span>
                    </div>`;
            }
            
            if(podium1.length > 0) {
                html += `
                    <div class="podium-step p-1" id="pod-1">
                        <span class="podium-rank">1er</span>
                        <div class="podium-names">${formatNames(podium1)}</div>
                        <span class="podium-points">${podium1[0].score} pts</span>
                    </div>`;
            }
            
            if(podium3.length > 0) {
                let rank3 = podium3[0].rank;
                html += `
                    <div class="podium-step p-3" id="pod-3">
                        <span class="podium-rank">${rank3 === 1 ? '1er' : rank3 + 'ème'}</span>
                        <div class="podium-names">${formatNames(podium3)}</div>
                        <span class="podium-points">${podium3[0].score} pts</span>
                    </div>`;
            }

            html += `</div>`;

            let podiumTeamsNames = [...podium1, ...podium2, ...podium3].map(t => t.name);
            let listTeams = allRankedTeams.filter(t => !podiumTeamsNames.includes(t.name));

            if(listTeams.length > 0) {
                html += `<div class="leaderboard-list glass-panel">`;
                listTeams.forEach(t => {
                    html += `
                        <div class="leaderboard-row glass-panel">
                            <div class="rank-badge">${t.rank}ème</div>
                            <div class="team-name-lb">${t.emoji} ${t.name}</div>
                            <div class="team-score-lb">${t.score} pts</div>
                        </div>`;
                });
                html += `</div>`;
            }

            html += `
                <div class="export-container">
                    <button class="btn-accent" onclick="exportResults()">Exporter les résultats</button>
                </div>
            `;

            renderView(html);

            setTimeout(() => {
                const p1 = document.getElementById('pod-1');
                const p2 = document.getElementById('pod-2');
                const p3 = document.getElementById('pod-3');
                if(p1) p1.style.height = '100%';
                if(p2) p2.style.height = '75%';
                if(p3) p3.style.height = '50%';
            }, 100); 
        }

        function getCurrentQuestionPoints() {
            if (currentPhase === 'p1') return QUESTIONS.phase1[currentQuestionIndex].pts;
            if (currentPhase === 'p2_q') return QUESTIONS.phase2[activeCategory][currentQuestionIndex].pts;
            if (currentPhase === 'p3_q') return QUESTIONS.phase3[currentQuestionIndex].pts;
            return 1;
        }

        function goToNextQuestion() {
            currentQuestionIndex++;
            if (currentPhase === 'p1') {
                renderGeneralPhase("Qualifications", QUESTIONS.phase1, 'startPhase2Categories');
            } else if (currentPhase === 'p2_q') {
                renderPhase2Question();
            } else if (currentPhase === 'p3_q') {
                renderPhase3Question();
            }
        }

        function sendLockToPhone(teamName) {
            // Utilisé pour bloquer uniquement l'équipe qui s'est trompée
            if (typeof connections !== 'undefined' && connections[teamName]) {
                connections[teamName].send({ type: 'lock', winner: 'Faux (Bloqué)' });
            }
        }

        function lockAllBuzzers() {
            if (typeof connections !== 'undefined') {
                Object.values(connections).forEach(c => {
                    c.send({ type: 'lock', winner: 'Regardez l\'écran' });
                });
            }
        }

        function resolveBuzz(isCorrect) {
            document.getElementById('buzz-popup').style.display = 'none';
            
            if (isCorrect) {
                // BONNE RÉPONSE 
                addPoints(currentBuzzedTeam, getCurrentQuestionPoints()); 
                isQuestionActive = false;
                buzzQueue = []; 
                currentBuzzedTeam = null; 
                revealAnswer(); 
                lockAllBuzzers(); 
                
            } else {
                // MAUVAISE RÉPONSE
                let failedTeam = currentBuzzedTeam; 
                getTeam(failedTeam).blocked = true; 
                sendLockToPhone(failedTeam); 
                
                currentBuzzedTeam = null; 

                if (currentPhase === 'p2_q') {
                    // LOGIQUE PHASE 2 : VOL ÉCHOUÉ
                    isQuestionActive = false;
                    revealAnswer();
                    lockAllBuzzers(); 
                } else {
                    // LOGIQUE PHASES 1 & 3 : FILE D'ATTENTE
                    if (buzzQueue.length > 0) {
                        processNextInQueue(); 
                    } else {
                        openBuzzers(); 
                        
                        // NOUVEAU : On réaffiche le bouton "Révéler" car le jeu reprend !
                        const btnReveal = document.getElementById('btn-reveal');
                        if (btnReveal) btnReveal.style.display = 'flex';

                        if (currentPhase === 'p3_q') {
                            pausePhase3Animation = false; 
                        }
                    }
                }
            }
        }

        function skipQuestion() {
            document.getElementById('btn-skip-question').style.display = 'none'; // Cache le bouton
            goToNextQuestion(); // Passe à la question suivante
        }
    </script>
</body>
</html>
