<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buzzer - Questions pour un Astronome</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0; padding: 20px; font-family: 'Josefin Sans', sans-serif;
            background-color: #191631; color: white; display: flex;
            flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #login-screen, #buzzer-screen { width: 100%; max-width: 400px; text-align: center; }
        
        /* Centrage du contenu de l'écran buzzer */
        #buzzer-screen { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        
        input {
            width: 100%; padding: 15px; margin-bottom: 20px; font-size: 1.2rem;
            border-radius: 15px; border: 1px solid #f7b731; background: rgba(0,0,0,0.5);
            color: white; box-sizing: border-box; text-align: center;
        }
        
        .btn-join {
            width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold;
            border-radius: 15px; background: #f7b731; color: #191631; border: none;
        }

        /* --- LE NOUVEAU BOUTON BUZZER ROND --- */
        #big-buzzer {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            margin: 30px auto;
            border: none;
            font-size: 3.5rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.15s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* État prêt (Vert éclatant) */
        .buzzer-ready { 
            background: radial-gradient(circle at 30% 30%, #00e676, #00b894); 
            color: white; 
            box-shadow: 0 15px 0 #008f73, 0 20px 40px rgba(0, 184, 148, 0.5); 
        }
        .buzzer-ready:active { 
            transform: translateY(15px); 
            box-shadow: 0 0 0 #008f73, 0 5px 10px rgba(0, 184, 148, 0.5); 
        }
        
        /* État bloqué (Rouge sombre/Grisé) */
        .buzzer-locked { 
            background: radial-gradient(circle at 30% 30%, #ff7675, #d63031); 
            color: rgba(255,255,255,0.8); 
            box-shadow: 0 10px 0 #b22828;
            transform: translateY(5px);
            pointer-events: none; 
        }
        
        #status-text { 
            font-size: 1.8rem; 
            min-height: 40px; 
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="color: #f7b731;">Buzzer Spatial</h1>
        <input type="text" id="code-input" placeholder="Code du salon (5 chiffres)">
        <input type="text" id="team-input" placeholder="Nom de l'équipe">
        <button class="btn-join" onclick="joinGame()">Rejoindre</button>
        <p id="error-msg" style="color: #ff7675; display: none;"></p>
    </div>

    <div id="buzzer-screen">
        <div id="status-text">En attente du signal...</div>
        <button id="big-buzzer" class="buzzer-locked" onclick="sendBuzz()">BUZZ</button>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let myTeamName = "";

        function joinGame() {
            const code = document.getElementById('code-input').value.trim();
            myTeamName = document.getElementById('team-input').value.trim();
            
            if(!code || !myTeamName) return;

            peer = new Peer(); // Client peer
            
            peer.on('open', () => {
                conn = peer.connect('astro-' + code);
                
                conn.on('open', () => {
                    conn.send({ type: 'join', teamName: myTeamName });
                });

                conn.on('data', (data) => {
                    if (data.type === 'joined') {
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('buzzer-screen').style.display = 'flex';
                    }
                    else if (data.type === 'unlock') {
                        const btn = document.getElementById('big-buzzer');
                        btn.className = 'buzzer-ready';
                        btn.innerText = 'BUZZ';
                        document.getElementById('status-text').innerText = 'C\'EST PARTI !';
                    }
                    else if (data.type === 'lock') {
                        const btn = document.getElementById('big-buzzer');
                        btn.className = 'buzzer-locked';
                        btn.innerText = 'VERROUILLÉ';
                        
                        if(data.winner === myTeamName) {
                            document.getElementById('status-text').innerHTML = '<span style="color:#f7b731">VOUS AVEZ LA MAIN !</span>';
                        } else {
                            document.getElementById('status-text').innerText = 'Trop tard : ' + data.winner;
                        }
                    }
                });
            });
        }

        function sendBuzz() {
            if(conn && conn.open) {
                conn.send({ type: 'buzz', teamName: myTeamName });
            }
        }
    </script>

    <!-- Fenêtre Pop-up de Buzz -->
<div id="buzz-popup" class="glass-panel" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; padding: 40px; border-radius: 30px; text-align: center; flex-direction: column; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 2px solid var(--accent-color);">
    <h2 style="font-size: 3rem; margin-bottom: 10px;">🚨 BZZZ !</h2>
    <div id="buzz-team-name" style="font-size: 4rem; color: var(--accent-color); font-family: 'Chau Philomene One'; margin-bottom: 30px;">Equipe</div>
    
    <div style="display: flex; gap: 20px; justify-content: center;">
        <button class="btn-success" onclick="resolveBuzz(true)" style="font-size: 1.5rem;">✅ Bonne réponse</button>
        <button class="btn-danger" onclick="resolveBuzz(false)" style="font-size: 1.5rem;">❌ Faux (Dommage !)</button>
    </div>
</div>

<!-- Bouton "Passer à la question suivante" (Maître du jeu) -->
<button id="btn-skip-question" class="glass-panel" onclick="skipQuestion()" style="display: none; position: fixed; bottom: 30px; right: 30px; z-index: 50; background: rgba(255,255,255,0.1);">Passer la question ➔</button>

</body>
</html>
