<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Empêche le zoom sur mobile pour un confort total -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buzzer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Josefin Sans', sans-serif;
            background-color: #191631; color: white; display: flex;
            flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; height: 100dvh; /* S'adapte à la barre d'adresse mobile */
            overflow: hidden;
            user-select: none; -webkit-user-select: none; /* Empêche la sélection de texte accidentelle */
        }
        
        #login-screen { 
            width: 90%; max-width: 350px; text-align: center; 
            background: rgba(255,255,255,0.05); padding: 30px; 
            border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
        }
        
        #buzzer-screen { 
            display: none; height: 100%; width: 100%; 
            flex-direction: column; align-items: center; justify-content: center; 
            padding: 20px; box-sizing: border-box;
        }
        
        input {
            width: 100%; padding: 15px; margin-bottom: 20px; font-size: 1.2rem;
            border-radius: 15px; border: 1px solid #f7b731; background: rgba(0,0,0,0.5);
            color: white; box-sizing: border-box; text-align: center;
        }
        
        .btn-join {
            width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold;
            border-radius: 15px; background: #f7b731; color: #191631; border: none;
            cursor: pointer; touch-action: manipulation;
        }

        /* --- BUZZER RESPONSIVE --- */
        #big-buzzer {
            width: 80vw; /* 80% de la largeur de l'écran */
            max-width: 350px; /* Pas trop gros sur tablette/PC */
            aspect-ratio: 1 / 1; /* Assure un cercle parfait */
            height: auto;
            border-radius: 50%; border: none;
            font-size: clamp(2rem, 8vw, 3.5rem); /* Taille du texte dynamique */
            font-weight: bold; text-transform: uppercase;
            transition: all 0.1s ease; cursor: pointer;
            -webkit-tap-highlight-color: transparent; 
            margin: 20px 0; line-height: 1.2;
            touch-action: manipulation; /* Supprime le délai de 300ms sur mobile */
        }
        
        .buzzer-ready { 
            background: radial-gradient(circle at 30% 30%, #00e676, #00b894); color: white; 
            box-shadow: 0 15px 0 #008f73, 0 10px 30px rgba(0, 184, 148, 0.4); 
        }
        .buzzer-ready:active { 
            transform: translateY(15px); box-shadow: 0 0 0 #008f73; 
        }
        
        .buzzer-locked { 
            background: radial-gradient(circle at 30% 30%, #ff7675, #d63031); 
            color: rgba(255,255,255,0.9); box-shadow: 0 10px 0 #b22828;
            transform: translateY(5px); pointer-events: none;
        }

        .buzzer-winner {
            background: radial-gradient(circle at 30% 30%, #f1c40f, #f39c12); 
            color: #191631; box-shadow: 0 10px 0 #d35400;
            transform: translateY(5px); pointer-events: none;
        }
        
        #status-text { 
            font-size: clamp(1.4rem, 5vw, 2rem); 
            min-height: 50px; margin-bottom: 10px; 
            font-weight: bold; text-align: center; 
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="color: #f7b731; margin-top: 0;">Buzzer Spatial</h1>
        <input type="text" id="code-input" placeholder="Code (5 chiffres)">
        <input type="text" id="team-input" placeholder="Nom de l'équipe">
        <button class="btn-join" onclick="joinGame()">Rejoindre</button>
    </div>

    <div id="buzzer-screen">
        <div id="status-text">En attente...</div>
        <button id="big-buzzer" class="buzzer-locked">🔒<br>ATTENTE</button>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let myTeamName = "";

        function joinGame() {
            const code = document.getElementById('code-input').value.trim();
            myTeamName = document.getElementById('team-input').value.trim();
            if(!code || !myTeamName) return;

            peer = new Peer(); 
            peer.on('open', () => {
                conn = peer.connect('astro-' + code);
                conn.on('open', () => {
                    conn.send({ type: 'join', teamName: myTeamName });
                });

                conn.on('data', (data) => {
                    if (data.type === 'joined') {
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('buzzer-screen').style.display = 'flex';
                    }
                    else if (data.type === 'unlock') {
                        const btn = document.getElementById('big-buzzer');
                        btn.className = 'buzzer-ready';
                        btn.innerHTML = 'BUZZ';
                        document.getElementById('status-text').innerText = 'C\'EST PARTI !';
                    }
                    else if (data.type === 'lock') {
                        const btn = document.getElementById('big-buzzer');
                        if(data.winner === myTeamName) {
                            document.getElementById('status-text').innerHTML = '<span style="color:#f7b731">À VOUS !</span>';
                            btn.className = 'buzzer-winner';
                            btn.innerHTML = '🎤<br>PARLEZ';
                        } else {
                            document.getElementById('status-text').innerText = data.winner ? 'Trop tard : ' + data.winner : 'Bloqué';
                            btn.className = 'buzzer-locked';
                            btn.innerHTML = '🔒<br>BLOQUÉ';
                        }
                    }
                });
            });
        }

        // Utilisation de touchstart pour une réactivité instantanée sur mobile
        function triggerBuzz(e) {
            if (e) e.preventDefault(); // Évite le double événement (touch puis click)
            if (conn && conn.open && document.getElementById('big-buzzer').classList.contains('buzzer-ready')) {
                conn.send({ type: 'buzz', teamName: myTeamName });
            }
        }

        const btnBuzz = document.getElementById('big-buzzer');
        btnBuzz.addEventListener('touchstart', triggerBuzz, { passive: false });
        btnBuzz.addEventListener('mousedown', triggerBuzz); // Gardé pour les tests sur PC
    </script>
</body>
</html>
