<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Buzzer Spatial</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Josefin Sans', sans-serif;
            background-color: #191631; color: white; display: flex;
            flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; min-height: 100dvh;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        
        /* Conteneur de connexion occupant presque tout l'écran */
        #login-screen { 
            width: 90vw; max-width: 400px; text-align: center; 
            background: rgba(255,255,255,0.05); padding: 40px 20px; 
            border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
        }

        h1 { font-size: 2.5rem; margin-top: 0; margin-bottom: 30px; color: #f7b731; }
        
        #buzzer-screen { 
            display: none; height: 100%; width: 100%; 
            flex-direction: column; align-items: center; justify-content: center; 
            box-sizing: border-box;
        }
        
        /* Champs de texte massifs pour éviter le zoom iOS/Android */
        input {
            width: 100%; padding: 20px; margin-bottom: 20px; 
            font-size: 1.5rem; border-radius: 15px; border: 2px solid #f7b731; 
            background: rgba(0,0,0,0.5); color: white; 
            box-sizing: border-box; text-align: center;
        }
        
        .btn-join {
            width: 100%; padding: 20px; font-size: 1.5rem; font-weight: bold;
            border-radius: 15px; background: #f7b731; color: #191631; border: none;
            cursor: pointer; text-transform: uppercase;
        }

        /* Buzzer géant */
        #big-buzzer {
            width: 85vw; max-width: 400px; aspect-ratio: 1 / 1; 
            border-radius: 50%; border: none;
            font-size: 3rem; font-weight: bold; text-transform: uppercase;
            transition: transform 0.1s ease; cursor: pointer;
            -webkit-tap-highlight-color: transparent; 
            margin: 20px 0; line-height: 1.2; box-sizing: border-box;
        }
        
        .buzzer-ready { 
            background: radial-gradient(circle at 30% 30%, #00e676, #00b894); color: white; 
            box-shadow: 0 15px 0 #008f73, 0 10px 30px rgba(0, 184, 148, 0.4); 
        }
        .buzzer-ready:active { transform: translateY(15px); box-shadow: 0 0 0 #008f73; }
        
        .buzzer-locked { 
            background: radial-gradient(circle at 30% 30%, #ff7675, #d63031); 
            color: rgba(255,255,255,0.9); box-shadow: 0 10px 0 #b22828;
            pointer-events: none;
        }

        .buzzer-winner {
            background: radial-gradient(circle at 30% 30%, #f1c40f, #f39c12); 
            color: #191631; box-shadow: 0 10px 0 #d35400;
            pointer-events: none;
        }
        
        #status-text { 
            font-size: 2rem; min-height: 60px; margin-bottom: 20px; 
            font-weight: bold; text-align: center; width: 90%; word-break: break-word;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Buzzer Spatial</h1>
        <input type="number" id="code-input" placeholder="Code salon" pattern="\d*">
        <input type="text" id="team-input" placeholder="Nom d'équipe">
        <button class="btn-join" onclick="joinGame()">Rejoindre</button>
    </div>

    <div id="buzzer-screen">
        <div id="status-text">En attente...</div>
        <button id="big-buzzer" class="buzzer-locked">🔒<br>ATTENTE</button>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let myTeamName = "";

        function joinGame() {
            const code = document.getElementById('code-input').value.trim();
            myTeamName = document.getElementById('team-input').value.trim();
            if(!code || !myTeamName) return;

            // Affichage de chargement
            document.querySelector('.btn-join').innerText = "Connexion...";

            peer = new Peer(); 
            peer.on('open', () => {
                conn = peer.connect('astro-' + code);
                
                conn.on('open', () => {
                    conn.send({ type: 'join', teamName: myTeamName });
                });

                conn.on('data', (data) => {
                    if (data.type === 'joined') {
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('buzzer-screen').style.display = 'flex';
                    }
                    else if (data.type === 'unlock') {
                        const btn = document.getElementById('big-buzzer');
                        btn.className = 'buzzer-ready';
                        btn.innerHTML = 'BUZZ';
                        document.getElementById('status-text').innerText = 'C\'EST PARTI !';
                    }
                    else if (data.type === 'lock') {
                        const btn = document.getElementById('big-buzzer');
                        if(data.winner === myTeamName) {
                            document.getElementById('status-text').innerHTML = '<span style="color:#f7b731">À VOUS !</span>';
                            btn.className = 'buzzer-winner';
                            btn.innerHTML = '🎤<br>PARLEZ';
                        } else {
                            document.getElementById('status-text').innerText = data.winner ? data.winner : 'Bloqué';
                            btn.className = 'buzzer-locked';
                            btn.innerHTML = '🔒<br>BLOQUÉ';
                        }
                    }
                });
                
                conn.on('error', () => {
                    document.querySelector('.btn-join').innerText = "Erreur, réessayer";
                });
            });
        }

        function triggerBuzz(e) {
            if (e) e.preventDefault(); 
            if (conn && conn.open && document.getElementById('big-buzzer').classList.contains('buzzer-ready')) {
                conn.send({ type: 'buzz', teamName: myTeamName });
            }
        }

        const btnBuzz = document.getElementById('big-buzzer');
        btnBuzz.addEventListener('touchstart', triggerBuzz, { passive: false });
        btnBuzz.addEventListener('mousedown', triggerBuzz);
    </script>
</body>
</html>
