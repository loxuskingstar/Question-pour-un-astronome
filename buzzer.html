<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Buzzer</title>
    <link rel="stylesheet" href="buzzer.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1 class="login-title">Buzzer</h1>
            <div class="login-subtitle">Rejoignez la partie</div>
            
            <div class="input-group">
                <input type="number" id="code-input" placeholder="Code salon" pattern="\d*">
            </div>
            <div class="input-group">
                <input type="text" id="team-input" placeholder="Nom d'équipe" maxlength="15">
            </div>
            
            <button class="btn-join" onclick="joinGame()" id="btn-connect">Jouer</button>
        </div>
    </div>

    <div id="buzzer-screen">
        <div class="status-container">
            <div id="status-text">En attente...</div>
        </div>
        
        <div class="buzzer-wrapper">
            <button id="big-buzzer" class="buzzer-locked">
                <span class="icon">🔒</span>
                <span>Bloqué</span>
            </button>
        </div>
    </div>

    <div id="podium-screen">
        <div class="medal" id="podium-medal">🏅</div>
        <h2 class="rank-text" id="podium-rank-text">1er</h2>
        <div class="score-text" id="podium-score-text">0 pts</div>
    </div>

    <script src="buzzer.js"></script>
</body>
</html>
