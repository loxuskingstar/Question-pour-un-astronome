<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Télécommande Maître du Jeu</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0914; --panel: rgba(255,255,255,.055); --panel-strong: rgba(255,255,255,.09);
            --border: rgba(255,255,255,.14); --text: #fff; --muted: #aaa7b8;
            --accent: #f7b731; --accent-glow: rgba(247,183,49,.35);
            --success: #00b894; --danger: #ff7675; --info: #3498db; --purple: #9b59b6;
        }
        * { box-sizing: border-box; }
        html, body {
            margin:0; min-height:100%; background:
            radial-gradient(circle at 20% 0%, rgba(247,183,49,.08), transparent 35%),
            radial-gradient(circle at 100% 100%, rgba(52,152,219,.08), transparent 35%), var(--bg);
        }
        body {
            font-family:'Josefin Sans',sans-serif; color:var(--text); min-height:100dvh;
            touch-action:manipulation; user-select:none; -webkit-user-select:none;
            -webkit-tap-highlight-color:transparent; overflow:hidden;
        }
        button,input { font:inherit; } button { touch-action:manipulation; }
        .glass-panel {
            background:var(--panel); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
            border:1px solid var(--border); box-shadow:0 10px 35px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.03);
            border-radius:22px;
        }

        #login-screen {
            min-height:100dvh; width:100%; display:flex; flex-direction:column; align-items:center;
            justify-content:center; padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
            text-align:center;
        }
        .login-card { width:min(100%,430px); padding:clamp(26px,6vw,42px); }
        .login-title {
            margin:0 0 8px; color:var(--accent); font-family:'Chau Philomene One',sans-serif;
            font-size:clamp(2.4rem,9vw,3.5rem); line-height:1;
        }
        .login-subtitle { margin:0 0 28px; color:var(--muted); font-size:1rem; line-height:1.4; }
        input {
            width:100%; min-height:58px; padding:14px 18px; margin-bottom:14px; border-radius:16px;
            border:2px solid rgba(247,183,49,.8); background:rgba(0,0,0,.38); color:#fff;
            text-align:center; font-size:1.2rem; outline:none;
        }
        input:focus { box-shadow:0 0 0 4px rgba(247,183,49,.12); border-color:var(--accent); }
        .btn-accent {
            width:100%; min-height:58px; padding:14px 20px; border:0; border-radius:16px;
            background:var(--accent); color:#191631; font-weight:800; font-size:1.1rem;
            cursor:pointer; box-shadow:0 0 24px var(--accent-glow);
        }
        .btn-accent:active { transform:scale(.985); }

        #master-screen {
            display:none; flex-direction:column; width:100%; height:100dvh; min-height:0;
            padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
                     max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); gap:10px;
        }
        .status-bar {
            flex:0 0 auto; min-height:42px; display:flex; align-items:center; justify-content:space-between;
            gap:12px; padding:0 4px; color:var(--accent); font-size:clamp(.9rem,3.2vw,1.15rem); font-weight:700;
        }
        .phase-badge { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .connection-status { color:var(--success); white-space:nowrap; }

        .text-box {
            flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:clamp(18px,4vw,30px);
            margin:0; -webkit-overflow-scrolling:touch;
        }
        .question-section { padding-bottom:18px; }
        .q-title,.a-title {
            margin:0 0 8px; font-size:.78rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
        }
        .q-title { color:var(--muted); } .a-title { color:var(--success); margin-top:22px; }
        .q-text,.a-text { margin:0; overflow-wrap:anywhere; }
        .q-text { font-size:clamp(1.2rem,4.5vw,1.65rem); line-height:1.42; font-weight:600; }
        .a-text { font-size:clamp(1.1rem,4vw,1.5rem); line-height:1.4; font-weight:800; }
        .answer-status {
            display:inline-flex; align-items:center; gap:7px; margin-top:18px; padding:8px 11px;
            border-radius:999px; background:rgba(0,184,148,.12); border:1px solid rgba(0,184,148,.35);
            color:var(--success); font-size:.8rem; font-weight:800;
        }

        .controls-container { flex:0 0 auto; width:100%; display:flex; flex-direction:column; gap:9px; }
        .control-group { display:flex; flex-direction:column; gap:9px; }
        .turn-label { text-align:center; color:var(--accent); font-size:1rem; padding:3px 0; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; width:100%; }
        .btn-action {
            width:100%; min-height:58px; padding:12px 14px; border-radius:16px; border:1px solid transparent;
            cursor:pointer; text-align:center; font-size:clamp(1rem,3.7vw,1.2rem); font-weight:800; line-height:1.15;
            transition:transform .1s ease,opacity .15s ease,filter .15s ease;
        }
        .btn-action:active { transform:scale(.975); }
        .btn-action:disabled { opacity:.35; cursor:not-allowed; filter:grayscale(.3); }
        .btn-reveal { background:var(--panel-strong); color:#fff; border-color:rgba(255,255,255,.28); }
        .btn-skip { background:var(--info); color:#fff; box-shadow:0 7px 20px rgba(52,152,219,.2); }
        .btn-true { background:rgba(0,184,148,.16); border-color:var(--success); color:#65f0ce; }
        .btn-false { background:rgba(255,118,117,.14); border-color:var(--danger); color:#ff9d9b; }
        .btn-hold { background:var(--purple); color:#fff; min-height:66px; box-shadow:0 7px 22px rgba(155,89,182,.3); }
        .skip-lock-note { margin:0; text-align:center; color:var(--muted); font-size:.78rem; line-height:1.25; }

        #buzz-overlay {
            display:none; position:fixed; inset:0; z-index:200; padding:
            max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right))
            max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
            background:rgba(11,9,20,.97); align-items:center; justify-content:center; text-align:center;
        }
        .buzz-card { width:min(100%,520px); padding:clamp(22px,6vw,40px); }
        #buzz-overlay h2 {
            margin:0 0 26px; color:var(--accent); font-family:'Chau Philomene One',sans-serif;
            font-size:clamp(2rem,8vw,3rem); line-height:1.05; overflow-wrap:anywhere;
        }
        #buzz-overlay .btn-action { min-height:70px; }

        @media (min-width:700px) {
            #master-screen { max-width:900px; margin:0 auto; padding-left:18px; padding-right:18px; }
            .text-box { padding:28px 34px; }
            .controls-container { display:grid; grid-template-columns:1fr 1fr; align-items:stretch; }
            #ctrl-standard,.full-width { grid-column:1/-1; }
            .btn-action { min-height:62px; }
        }
        @media (max-height:650px) {
            #master-screen { gap:6px; } .status-bar { min-height:34px; } .text-box { padding:15px 17px; }
            .q-text { font-size:1.15rem; } .a-title { margin-top:14px; }
            .btn-action { min-height:50px; padding:9px 12px; } .controls-container { gap:6px; }
        }
        @media (orientation:landscape) and (max-height:600px) {
            #master-screen { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr); grid-template-rows:auto 1fr; column-gap:12px; }
            .status-bar { grid-column:1/-1; } .text-box { grid-column:1; grid-row:2; }
            .controls-container { grid-column:2; grid-row:2; display:flex; justify-content:center; }
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="glass-panel login-card">
            <h1 class="login-title">Console Master</h1>
            <p class="login-subtitle">Contrôlez la partie depuis votre téléphone ou votre tablette.</p>
            <input type="number" id="code-input" placeholder="Code du salon" inputmode="numeric" pattern="\d*" autocomplete="off">
            <button class="btn-accent" onclick="joinMaster()">Connecter</button>
            <p id="status-msg" style="margin:16px 0 0;color:#dcdcdc;"></p>
        </div>
    </div>

    <div id="master-screen">
        <div class="status-bar">
            <span id="ui-phase" class="phase-badge">En attente...</span>
            <span class="connection-status">● Connecté</span>
        </div>

        <div class="glass-panel text-box" id="question-card">
            <section class="question-section">
                <p class="q-title">Question</p>
                <p class="q-text" id="ui-question">En attente du lancement du jeu...</p>
            </section>
            <section>
                <p class="a-title">Réponse secrète</p>
                <p class="a-text" id="ui-answer">••••••••</p>
                <div id="answer-status" class="answer-status" style="display:none;">✓ Réponse révélée</div>
            </section>
        </div>

        <div class="controls-container">
            <div id="ctrl-p2" class="control-group full-width" style="display:none;">
                <div class="turn-label">Tour de : <b id="p2-team-name"></b></div>
                <div class="grid-2">
                    <button class="btn-action btn-true" onclick="sendCmd('p2_resolve',true)">✅ VRAI</button>
                    <button class="btn-action btn-false" onclick="sendCmd('p2_resolve',false)">❌ FAUX / VOL</button>
                </div>
            </div>

            <div id="ctrl-p3" class="control-group full-width" style="display:none;">
                <button class="btn-action btn-hold" id="btn-p3-anim">🪄 MAINTENIR POUR DÉVOILER</button>
            </div>

            <div id="ctrl-standard" class="control-group full-width">
                <button id="btn-reveal" class="btn-action btn-reveal" onclick="sendCmd('reveal')">👁️ Révéler la réponse</button>
                <button id="btn-skip" class="btn-action btn-skip" onclick="requestSkip()" disabled>Passer à la suite ➔</button>
                <p id="skip-note" class="skip-lock-note">Révélez d'abord la réponse pour continuer.</p>
            </div>
        </div>
    </div>

    <div id="buzz-overlay">
        <div class="glass-panel buzz-card">
            <h2 id="buzz-team-title">Équipe a buzzé !</h2>
            <div class="grid-2">
                <button class="btn-action btn-true" onclick="sendCmd('resolve',true)">✅ VRAI</button>
                <button class="btn-action btn-false" onclick="sendCmd('resolve',false)">❌ FAUX</button>
            </div>
        </div>
    </div>
    <script>
        let peer=null, conn=null, canSkip=false, p3PointerDown=false;

        function joinMaster(){
            const code=document.getElementById('code-input').value.trim();
            if(!code) return;
            const status=document.getElementById('status-msg');
            status.innerText="Connexion...";
            peer=new Peer();
            peer.on('error',()=>status.innerText="Impossible de se connecter à ce salon.");
            peer.on('open',()=>{
                conn=peer.connect('astro-'+code);
                conn.on('open',()=>conn.send({type:'join_master'}));
                conn.on('data',(data)=>{
                    if(data.type==='master_joined'){
                        document.getElementById('login-screen').style.display='none';
                        document.getElementById('master-screen').style.display='flex';
                    }else if(data.type==='sync') updateMasterUI(data);
                });
                conn.on('close',()=>{
                    const el=document.querySelector('.connection-status');
                    el.innerText='● Déconnecté'; el.style.color='#ff7675';
                });
                conn.on('error',()=>status.innerText="Erreur de connexion. Vérifiez le code du salon.");
            });
        }

        function sendCmd(action,isCorrect=null){
            if(conn&&conn.open) conn.send({type:'master_cmd',action,isCorrect});
        }

        function requestSkip(){
            if(!canSkip) return;
            canSkip=false;
            updateSkipButton();
            sendCmd('skip');
        }

        function updateSkipButton(){
            const btn=document.getElementById('btn-skip'), note=document.getElementById('skip-note');
            if(!btn||!note) return;
            btn.disabled=!canSkip;
            note.innerText=canSkip
                ?"La réponse est révélée : vous pouvez continuer."
                :"Révélez d'abord la réponse pour continuer.";
        }

        function updateMasterUI(data){
            const names={p1:'Qualifications',p2_q:'À la carte',p3_q:'Jeu décisif',p2_cat:'Choix du thème',p2_turn:'Tour suivant'};
            document.getElementById('ui-phase').innerText=names[data.phase]||'Accueil';
            document.getElementById('ui-question').innerHTML=data.question||'En attente du lancement du jeu...';
            document.getElementById('ui-answer').innerHTML=data.answer||'••••••••';

            const questionPhase=['p1','p2_q','p3_q'].includes(data.phase);
            const answerRevealed=data.canSkip===true || (questionPhase && data.isQuestionActive===false);
            canSkip=data.canSkip===true || answerRevealed;

            document.getElementById('answer-status').style.display=answerRevealed?'inline-flex':'none';

            const p2=document.getElementById('ctrl-p2'), p3=document.getElementById('ctrl-p3');
            const standard=document.getElementById('ctrl-standard'), overlay=document.getElementById('buzz-overlay');
            const reveal=document.getElementById('btn-reveal');

            p2.style.display='none'; p3.style.display='none'; standard.style.display='flex'; overlay.style.display='none';
            reveal.style.display=answerRevealed?'none':'block';

            if(data.buzzedTeam){
                overlay.style.display='flex'; standard.style.display='none'; p3.style.display='none';
                document.getElementById('buzz-team-title').innerText=data.buzzedTeam+" a buzzé !";
            }else if(data.phase==='p2_q' && data.activeTeamName && !data.isQuestionActive){
                standard.style.display='none'; p2.style.display='flex';
            }else if(data.phase==='p3_q'){
                p3.style.display='flex'; standard.style.display='flex';
            }

            document.getElementById('p2-team-name').innerText=data.activeTeamName||'';
            updateSkipButton();
        }

        const btnP3=document.getElementById('btn-p3-anim');
        btnP3.addEventListener('pointerdown',(e)=>{
            e.preventDefault(); if(p3PointerDown)return;
            p3PointerDown=true; btnP3.setPointerCapture?.(e.pointerId); sendCmd('p3_down');
        });
        const stopP3=(e)=>{
            if(!p3PointerDown)return;
            e.preventDefault(); p3PointerDown=false; sendCmd('p3_up');
        };
        btnP3.addEventListener('pointerup',stopP3);
        btnP3.addEventListener('pointercancel',stopP3);
        btnP3.addEventListener('lostpointercapture',()=>{
            if(p3PointerDown){p3PointerDown=false;sendCmd('p3_up');}
        });
    </script>
</body>
</html>
