<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Télécommande Maître du Jeu</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Josefin Sans', sans-serif;
            background-color: #0b0914; color: white; display: flex; flex-direction: column;
            min-height: 100dvh; touch-action: manipulation; user-select: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-radius: 20px; padding: 20px; margin-bottom: 15px;
        }

        /* --- ÉCRAN DE CONNEXION --- */
        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100dvh; padding: 20px; box-sizing: border-box; text-align: center;
        }
        input {
            width: 100%; max-width: 350px; padding: 20px; margin-bottom: 20px; font-size: 1.5rem;
            border-radius: 15px; border: 2px solid #f7b731; background: rgba(0,0,0,0.5);
            color: white; text-align: center; box-sizing: border-box;
        }
        .btn-accent {
            background: #f7b731; color: #191631; border: none; font-weight: 700;
            padding: 20px; font-size: 1.5rem; border-radius: 15px; width: 100%; max-width: 350px;
            box-shadow: 0 0 20px rgba(247, 183, 49, 0.4); cursor: pointer; text-transform: uppercase;
        }

        /* --- ÉCRAN TÉLÉCOMMANDE --- */
        #master-screen { display: none; flex-direction: column; padding: 15px; height: 100dvh; box-sizing: border-box; }
        
        .status-bar { display: flex; justify-content: space-between; font-size: 1.2rem; color: #f7b731; margin-bottom: 10px; font-weight: bold; }
        
        .text-box { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; }
        .q-title { font-size: 1.2rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px 0; }
        .q-text { font-size: 1.5rem; line-height: 1.4; margin: 0; font-weight: 600; }
        .a-title { font-size: 1.2rem; color: #00b894; margin: 15px 0 5px 0; text-transform: uppercase; }
        .a-text { font-size: 1.5rem; margin: 0; color: white; font-weight: bold; }

        /* Boutons de contrôle */
        .controls-container { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        
        .btn-action {
            padding: 15px; font-size: 1.2rem; font-family: 'Josefin Sans', sans-serif; font-weight: bold;
            border-radius: 15px; border: none; cursor: pointer; text-align: center; transition: transform 0.1s;
        }
        .btn-action:active { transform: scale(0.98); }
        
        .btn-reveal { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); }
        .btn-skip { background: #3498db; color: white; }
        
        .btn-true { background: rgba(0, 184, 148, 0.2); border: 2px solid #00b894; color: #00b894; }
        .btn-false { background: rgba(255, 118, 117, 0.2); border: 2px solid #ff7675; color: #ff7675; }
        
        .btn-hold { background: #9b59b6; color: white; font-size: 1.4rem; padding: 25px; box-shadow: 0 5px 20px rgba(155, 89, 182, 0.4); }

        /* Modal Pop-up Buzz (Prend tout l'écran de la télécommande) */
        #buzz-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 9, 20, 0.95); z-index: 200; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; text-align: center;
        }
        #buzz-overlay h2 { font-size: 2.5rem; color: #f7b731; margin-bottom: 30px; font-family: 'Chau Philomene One'; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="color: #f7b731; font-family: 'Chau Philomene One'; font-size: 3rem;">Console Master</h1>
        <input type="number" id="code-input" placeholder="Code du salon" pattern="\d*">
        <button class="btn-accent" onclick="joinMaster()">Connecter</button>
        <p id="status-msg" style="margin-top: 20px; color: #dcdcdc;"></p>
    </div>

    <div id="master-screen">
        <div class="status-bar">
            <span id="ui-phase">En attente...</span>
            <span style="color: #00b894;">● Connecté</span>
        </div>

        <div class="glass-panel text-box">
            <p class="q-title">Question</p>
            <p class="q-text" id="ui-question">En attente du lancement du jeu...</p>
            
            <p class="a-title">Réponse secrète</p>
            <p class="a-text" id="ui-answer">...</p>
        </div>

        <div class="controls-container">
            <!-- Contrôles P2 (Équipe active) -->
            <div id="ctrl-p2" style="display: none; flex-direction: column; gap: 10px;">
                <div style="text-align: center; color: #f7b731; font-size: 1.2rem; margin-bottom: 5px;">Tour de : <b id="p2-team-name"></b></div>
                <div class="grid-2">
                    <button class="btn-action btn-true" onclick="sendCmd('p2_resolve', true)">✅ VRAI</button>
                    <button class="btn-action btn-false" onclick="sendCmd('p2_resolve', false)">❌ FAUX (Vol)</button>
                </div>
            </div>

            <!-- Contrôles P3 (Animation Espace) -->
            <div id="ctrl-p3" style="display: none; flex-direction: column;">
                <button class="btn-action btn-hold" id="btn-p3-anim">🪄 MAINTENIR POUR DÉVOILER</button>
            </div>

            <!-- Contrôles standards -->
            <div id="ctrl-standard" style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-action btn-reveal" onclick="sendCmd('reveal')">Révéler la réponse</button>
                <button class="btn-action btn-skip" onclick="sendCmd('skip')">Passer à la suite ➔</button>
            </div>
        </div>
    </div>

    <!-- Écran d'interruption quand quelqu'un buzze -->
    <div id="buzz-overlay">
        <h2 id="buzz-team-title">Equipe a buzzé !</h2>
        <div class="grid-2">
            <button class="btn-action btn-true" style="padding: 30px; font-size: 1.5rem;" onclick="sendCmd('resolve', true)">✅ VRAI</button>
            <button class="btn-action btn-false" style="padding: 30px; font-size: 1.5rem;" onclick="sendCmd('resolve', false)">❌ FAUX</button>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;

        function joinMaster() {
            const code = document.getElementById('code-input').value.trim();
            if(!code) return;

            document.getElementById('status-msg').innerText = "Connexion...";
            peer = new Peer(); 
            peer.on('open', () => {
                conn = peer.connect('astro-' + code);
                conn.on('open', () => {
                    conn.send({ type: 'join_master' });
                });

                conn.on('data', (data) => {
                    if (data.type === 'master_joined') {
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('master-screen').style.display = 'flex';
                    }
                    else if (data.type === 'sync') {
                        updateMasterUI(data);
                    }
                });
            });
        }

        function sendCmd(action, isCorrect = null) {
            if(conn && conn.open) {
                conn.send({ type: 'master_cmd', action: action, isCorrect: isCorrect });
            }
        }

        function updateMasterUI(data) {
            document.getElementById('ui-phase').innerText = data.phase === 'p1' ? 'Qualifications' : (data.phase === 'p2_q' ? 'A la carte' : (data.phase === 'p3_q' ? 'Jeu Décisif' : 'Accueil'));
            document.getElementById('ui-question').innerHTML = data.question;
            document.getElementById('ui-answer').innerHTML = data.answer;

            // Reset des affichages
            document.getElementById('ctrl-p2').style.display = 'none';
            document.getElementById('ctrl-p3').style.display = 'none';
            document.getElementById('ctrl-standard').style.display = 'flex';
            document.getElementById('buzz-overlay').style.display = 'none';

            // Si quelqu'un a buzzé : Modal plein écran !
            if (data.buzzedTeam) {
                document.getElementById('buzz-overlay').style.display = 'flex';
                document.getElementById('buzz-team-title').innerText = data.buzzedTeam + " a buzzé !";
            } 
            // Si Phase 2 (et personne n'a buzzé, l'équipe active parle)
            else if (data.phase === 'p2_q' && data.activeTeamName && !data.isQuestionActive) {
                document.getElementById('ctrl-standard').style.display = 'none';
                document.getElementById('ctrl-p2').style.display = 'flex';
                document.getElementById('p2-team-name').innerText = data.activeTeamName;
            } 
            // Si Phase 3
            else if (data.phase === 'p3_q') {
                document.getElementById('ctrl-p3').style.display = 'flex';
            }
        }

        // Gestion tactile du bouton Phase 3
        const btnP3 = document.getElementById('btn-p3-anim');
        btnP3.addEventListener('touchstart', (e) => { e.preventDefault(); sendCmd('p3_down'); }, { passive: false });
        btnP3.addEventListener('touchend', (e) => { e.preventDefault(); sendCmd('p3_up'); });
        btnP3.addEventListener('mousedown', () => sendCmd('p3_down'));
        btnP3.addEventListener('mouseup', () => sendCmd('p3_up'));
        btnP3.addEventListener('mouseleave', () => sendCmd('p3_up'));
    </script>
</body>
</html>
