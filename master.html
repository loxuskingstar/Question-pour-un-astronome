<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Télécommande Maître du Jeu</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0b0914; --panel:rgba(255,255,255,.065); --panel-strong:rgba(255,255,255,.10);
            --border:rgba(255,255,255,.17); --text:#fff; --muted:#c0bdcc;
            --accent:#f7b731; --accent-glow:rgba(247,183,49,.35);
            --success:#00b894; --danger:#ff7675; --info:#3498db; --purple:#9b59b6;
        }

        * { box-sizing:border-box; }

        html,body {
            margin:0; min-height:100%;
            background:
                radial-gradient(circle at 20% 0%,rgba(247,183,49,.10),transparent 38%),
                radial-gradient(circle at 100% 100%,rgba(52,152,219,.10),transparent 38%),var(--bg);
        }

        body {
            font-family:'Josefin Sans',sans-serif; color:var(--text); min-height:100dvh;
            touch-action:manipulation; user-select:none; -webkit-user-select:none;
            -webkit-tap-highlight-color:transparent; overflow:hidden;
        }

        button,input { font:inherit; }
        button { touch-action:manipulation; }

        .glass-panel {
            background:var(--panel); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
            border:1px solid var(--border);
            box-shadow:0 12px 38px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.04);
            border-radius:24px;
        }

        #login-screen {
            min-height:100dvh; width:100%; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
            text-align:center;
        }

        .login-card { width:min(100%,500px); padding:clamp(30px,7vw,48px); }
        .login-title {
            margin:0 0 12px; color:var(--accent); font-family:'Chau Philomene One',sans-serif;
            font-size:clamp(2.8rem,12vw,4.2rem); line-height:1;
        }
        .login-subtitle {
            margin:0 0 30px; color:var(--muted); font-size:clamp(1.05rem,4.5vw,1.35rem); line-height:1.4;
        }
        input {
            width:100%; min-height:70px; padding:16px 20px; margin-bottom:16px; border-radius:18px;
            border:2px solid rgba(247,183,49,.85); background:rgba(0,0,0,.40); color:#fff;
            text-align:center; font-size:clamp(1.35rem,5vw,1.7rem); outline:none;
        }
        input:focus { box-shadow:0 0 0 5px rgba(247,183,49,.14); border-color:var(--accent); }

        .btn-accent {
            width:100%; min-height:70px; padding:16px 22px; border:0; border-radius:18px;
            background:var(--accent); color:#191631; font-weight:800;
            font-size:clamp(1.25rem,5vw,1.55rem); cursor:pointer; box-shadow:0 0 28px var(--accent-glow);
        }
        .btn-accent:active { transform:scale(.985); }

        #master-screen {
            display:none; flex-direction:column; width:100%; height:100dvh; min-height:0;
            padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
                     max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
            gap:12px;
        }

        .status-bar {
            flex:0 0 auto; min-height:48px; display:flex; align-items:center; justify-content:space-between;
            gap:12px; padding:0 4px; color:var(--accent);
            font-size:clamp(1.05rem,4.5vw,1.35rem); font-weight:800;
        }
        .phase-badge { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .connection-status { color:var(--success); white-space:nowrap; }

        .text-box {
            flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
            padding:clamp(22px,5vw,36px); margin:0; -webkit-overflow-scrolling:touch;
        }

        .question-section { padding-bottom:20px; }
        .q-title,.a-title {
            margin:0 0 10px; font-size:clamp(.95rem,3.7vw,1.15rem);
            font-weight:800; letter-spacing:.12em; text-transform:uppercase;
        }
        .q-title { color:var(--muted); }
        .a-title { color:var(--success); margin-top:24px; }
        .q-text,.a-text { margin:0; overflow-wrap:anywhere; }
        .q-text {
            font-size:clamp(1.45rem,6vw,2.1rem); line-height:1.38; font-weight:700;
        }
        .a-text {
            font-size:clamp(1.35rem,5.5vw,1.9rem); line-height:1.38; font-weight:800;
        }

        .answer-status {
            display:inline-flex; align-items:center; gap:8px; margin-top:20px; padding:11px 15px;
            border-radius:999px; background:rgba(0,184,148,.14); border:1px solid rgba(0,184,148,.42);
            color:#5ff2d1; font-size:clamp(.95rem,3.8vw,1.15rem); font-weight:800;
        }

        .controls-container {
            flex:0 0 auto; width:100%; display:flex; flex-direction:column; gap:10px;
        }
        .control-group { display:flex; flex-direction:column; gap:10px; }
        .turn-label {
            text-align:center; color:var(--accent); font-size:clamp(1.1rem,4.5vw,1.35rem); padding:3px 0; font-weight:700;
        }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }

        .btn-action {
            width:100%; min-height:78px; padding:15px 12px; border-radius:18px;
            border:2px solid transparent; cursor:pointer; text-align:center;
            font-size:clamp(1.15rem,4.8vw,1.55rem); font-weight:900; line-height:1.08;
            transition:transform .1s ease,opacity .15s ease,filter .15s ease;
            box-shadow:0 5px 18px rgba(0,0,0,.18);
        }
        .btn-action:active { transform:scale(.975); }
        .btn-action:disabled { opacity:.30; cursor:not-allowed; filter:grayscale(.3); box-shadow:none; }

        .btn-reveal {
            background:var(--panel-strong); color:#fff; border-color:rgba(255,255,255,.30);
        }
        .btn-skip {
            background:var(--info); color:#fff; border-color:rgba(255,255,255,.08);
            box-shadow:0 8px 24px rgba(52,152,219,.28);
        }
        .btn-true {
            background:rgba(0,184,148,.18); border-color:var(--success); color:#70f4d4;
            box-shadow:0 7px 22px rgba(0,184,148,.20);
        }
        .btn-false {
            background:rgba(255,118,117,.16); border-color:var(--danger); color:#ffaaa8;
            box-shadow:0 7px 22px rgba(255,118,117,.18);
        }
        .btn-hold {
            background:var(--purple); color:#fff; min-height:86px;
            box-shadow:0 8px 26px rgba(155,89,182,.34);
        }
        .skip-lock-note {
            margin:0; text-align:center; color:var(--muted);
            font-size:clamp(.9rem,3.5vw,1.05rem); line-height:1.25;
        }

        #buzz-overlay {
            display:none; position:fixed; inset:0; z-index:200;
            padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right))
            max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
            background:rgba(11,9,20,.97); align-items:center; justify-content:center; text-align:center;
        }
        .buzz-card { width:min(100%,650px); padding:clamp(28px,7vw,48px); }
        #buzz-overlay h2 {
            margin:0 0 30px; color:var(--accent); font-family:'Chau Philomene One',sans-serif;
            font-size:clamp(2.5rem,11vw,4.2rem); line-height:1.03; overflow-wrap:anywhere;
        }
        #buzz-overlay .btn-action { min-height:100px; font-size:clamp(1.35rem,5.5vw,1.8rem); }

        /* Tablettes : grands contrôles côte à côte */
        @media (min-width:700px) {
            #master-screen { max-width:1100px; margin:0 auto; padding-left:20px; padding-right:20px; gap:14px; }
            .status-bar { min-height:54px; }
            .text-box { padding:32px 38px; }
            .controls-container {
                display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:stretch;
            }
            #ctrl-standard,.full-width { grid-column:1/-1; }
            .btn-action { min-height:86px; font-size:1.5rem; }
            .btn-hold { min-height:94px; }
        }

        /* Écran bas : on garde les boutons grands mais compacts */
        @media (max-height:700px) {
            #master-screen { gap:8px; }
            .status-bar { min-height:40px; }
            .text-box { padding:18px 20px; }
            .q-text { font-size:clamp(1.25rem,5vw,1.7rem); }
            .a-title { margin-top:16px; }
            .btn-action { min-height:68px; padding:12px 10px; }
            .btn-hold { min-height:74px; }
            .skip-lock-note { font-size:.88rem; }
        }

        /* Paysage téléphone : question à gauche, télécommande à droite */
        @media (orientation:landscape) and (max-height:650px) {
            #master-screen {
                display:grid; grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);
                grid-template-rows:auto 1fr; column-gap:14px; row-gap:8px;
            }
            .status-bar { grid-column:1/-1; }
            .text-box { grid-column:1; grid-row:2; }
            .controls-container {
                grid-column:2; grid-row:2; display:flex; justify-content:center; overflow-y:auto;
            }
            .btn-action { min-height:70px; }
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="glass-panel login-card">
            <h1 class="login-title">Console Master</h1>
            <p class="login-subtitle">Contrôlez la partie depuis votre téléphone ou votre tablette.</p>
            <input type="number" id="code-input" placeholder="Code du salon" inputmode="numeric" pattern="\d*" autocomplete="off">
            <button class="btn-accent" onclick="joinMaster()">Connecter</button>
            <p id="status-msg" style="margin:16px 0 0;color:#dcdcdc;"></p>
        </div>
    </div>

    <div id="master-screen">
        <div class="status-bar">
            <span id="ui-phase" class="phase-badge">En attente...</span>
            <span class="connection-status">● Connecté</span>
        </div>

        <div class="glass-panel text-box" id="question-card">
            <section class="question-section">
                <p class="q-title">Question</p>
                <p class="q-text" id="ui-question">En attente du lancement du jeu...</p>
            </section>
            <section>
                <p class="a-title">Réponse secrète</p>
                <p class="a-text" id="ui-answer">••••••••</p>
                <div id="answer-status" class="answer-status" style="display:none;">✓ Réponse révélée</div>
            </section>
        </div>

        <div class="controls-container">
            <div id="ctrl-p2" class="control-group full-width" style="display:none;">
                <div class="turn-label">Tour de : <b id="p2-team-name"></b></div>
                <div class="grid-2">
                    <button class="btn-action btn-true" onclick="sendCmd('p2_resolve',true)">✅ VRAI</button>
                    <button class="btn-action btn-false" onclick="sendCmd('p2_resolve',false)">❌ FAUX / VOL</button>
                </div>
            </div>

            <div id="ctrl-p3" class="control-group full-width" style="display:none;">
                <button class="btn-action btn-hold" id="btn-p3-anim">🪄 MAINTENIR POUR DÉVOILER</button>
            </div>

            <div id="ctrl-standard" class="control-group full-width">
                <div class="grid-2">
                    <button id="btn-reveal" class="btn-action btn-reveal" onclick="sendCmd('reveal')">👁️ Révéler</button>
                    <button id="btn-skip" class="btn-action btn-skip" onclick="requestSkip()" disabled>Passer à la suite ➔</button>
                </div>
                <p id="skip-note" class="skip-lock-note">Révélez d'abord la réponse pour continuer.</p>
            </div>
        </div>
    </div>

    <div id="buzz-overlay">
        <div class="glass-panel buzz-card">
            <h2 id="buzz-team-title">Équipe a buzzé !</h2>
            <div class="grid-2">
                <button class="btn-action btn-true" onclick="sendCmd('resolve',true)">✅ VRAI</button>
                <button class="btn-action btn-false" onclick="sendCmd('resolve',false)">❌ FAUX</button>
            </div>
        </div>
    </div>
    <script>
        let peer=null, conn=null, canSkip=false, p3PointerDown=false;

        function joinMaster(){
            const code=document.getElementById('code-input').value.trim();
            if(!code) return;
            const status=document.getElementById('status-msg');
            status.innerText="Connexion...";
            peer=new Peer();
            peer.on('error',()=>status.innerText="Impossible de se connecter à ce salon.");
            peer.on('open',()=>{
                conn=peer.connect('astro-'+code);
                conn.on('open',()=>conn.send({type:'join_master'}));
                conn.on('data',(data)=>{
                    if(data.type==='master_joined'){
                        document.getElementById('login-screen').style.display='none';
                        document.getElementById('master-screen').style.display='flex';
                    }else if(data.type==='sync') updateMasterUI(data);
                });
                conn.on('close',()=>{
                    const el=document.querySelector('.connection-status');
                    el.innerText='● Déconnecté'; el.style.color='#ff7675';
                });
                conn.on('error',()=>status.innerText="Erreur de connexion. Vérifiez le code du salon.");
            });
        }

        function sendCmd(action,isCorrect=null){
            if(conn&&conn.open) conn.send({type:'master_cmd',action,isCorrect});
        }

        function requestSkip(){
            if(!canSkip) return;
            canSkip=false;
            updateSkipButton();
            sendCmd('skip');
        }

        function updateSkipButton(){
            const btn=document.getElementById('btn-skip'), note=document.getElementById('skip-note');
            if(!btn||!note) return;
            btn.disabled=!canSkip;
            note.innerText=canSkip
                ?"La réponse est révélée : vous pouvez continuer."
                :"Révélez d'abord la réponse pour continuer.";
        }

        function updateMasterUI(data){
            const names={p1:'Qualifications',p2_q:'À la carte',p3_q:'Jeu décisif',p2_cat:'Choix du thème',p2_turn:'Tour suivant'};
            document.getElementById('ui-phase').innerText=names[data.phase]||'Accueil';
            document.getElementById('ui-question').innerHTML=data.question||'En attente du lancement du jeu...';
            document.getElementById('ui-answer').innerHTML=data.answer||'••••••••';

            const questionPhase=['p1','p2_q','p3_q'].includes(data.phase);
            const answerRevealed=data.canSkip===true || (questionPhase && data.isQuestionActive===false);
            canSkip=data.canSkip===true || answerRevealed;

            document.getElementById('answer-status').style.display=answerRevealed?'inline-flex':'none';

            const p2=document.getElementById('ctrl-p2'), p3=document.getElementById('ctrl-p3');
            const standard=document.getElementById('ctrl-standard'), overlay=document.getElementById('buzz-overlay');
            const reveal=document.getElementById('btn-reveal');

            p2.style.display='none'; p3.style.display='none'; standard.style.display='flex'; overlay.style.display='none';
            reveal.style.display=answerRevealed?'none':'block';

            if(data.buzzedTeam){
                overlay.style.display='flex'; standard.style.display='none'; p3.style.display='none';
                document.getElementById('buzz-team-title').innerText=data.buzzedTeam+" a buzzé !";
            }else if(data.phase==='p2_q' && data.activeTeamName && !data.isQuestionActive){
                standard.style.display='none'; p2.style.display='flex';
            }else if(data.phase==='p3_q'){
                p3.style.display='flex'; standard.style.display='flex';
            }

            document.getElementById('p2-team-name').innerText=data.activeTeamName||'';
            updateSkipButton();
        }

        const btnP3=document.getElementById('btn-p3-anim');
        btnP3.addEventListener('pointerdown',(e)=>{
            e.preventDefault(); if(p3PointerDown)return;
            p3PointerDown=true; btnP3.setPointerCapture?.(e.pointerId); sendCmd('p3_down');
        });
        const stopP3=(e)=>{
            if(!p3PointerDown)return;
            e.preventDefault(); p3PointerDown=false; sendCmd('p3_up');
        };
        btnP3.addEventListener('pointerup',stopP3);
        btnP3.addEventListener('pointercancel',stopP3);
        btnP3.addEventListener('lostpointercapture',()=>{
            if(p3PointerDown){p3PointerDown=false;sendCmd('p3_up');}
        });
    </script>
</body>
</html>
