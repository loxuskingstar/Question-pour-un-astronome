<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Télécommande Maître du Jeu</title>
    <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Lien vers le CSS -->
    <link rel="stylesheet" href="master.css">
    
    <!-- Librairie externe -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1 style="color: var(--accent); font-size: 2.8rem; margin-bottom: 5px;">Master</h1>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Contrôle à distance</p>
            <input type="number" id="code-input" placeholder="Code (5 chiffres)" pattern="\d*">
            <button class="btn btn-accent" onclick="joinMaster()">Connecter</button>
            <p id="status-msg" style="margin-top: 15px; color: var(--text-muted); font-size: 0.9rem;"></p>
        </div>
    </div>

    <div id="master-screen">
        <div class="header">
            <span class="phase-badge font-title" id="ui-phase">En attente...</span>
            <div class="status-area">
                <span id="conn-status" style="color: var(--success); font-size: 0.85rem;">●</span>
                <button class="btn-scores" style="font-size: 1.2rem; padding: 5px 10px; border-color: transparent;" onclick="document.getElementById('settings-overlay').style.display='flex'">⚙️</button>
                <button class="btn-scores" onclick="document.getElementById('score-overlay').style.display='flex'">SCORES</button>
            </div>
        </div>

        <div class="content-area">
            <div class="card">
                <div class="label">Question</div>
                <div class="q-text" id="ui-question">En attente du lancement du jeu...</div>
            </div>
            
            <div class="card" style="border: 1px solid rgba(0, 230, 118, 0.2);">
                <div class="label" style="color: var(--success);">Réponse secrète</div>
                <div class="a-text" id="ui-answer">••••••••</div>
                <div class="desc-box" id="ui-answer-description">
                    <div class="label" style="color: var(--info);">Infos</div>
                    <div class="desc-text" id="ui-answer-description-text"></div>
                </div>
            </div>
        </div>

        <div class="control-area">
            <div id="ctrl-standard">
                <button id="btn-reveal" class="btn btn-reveal" onclick="sendCmd('reveal')" style="margin-bottom: 10px;">👁️ Révéler</button>
                <button id="btn-skip" class="btn btn-skip" onclick="requestSkip()" disabled>Passer ➔</button>
                <div class="skip-note" id="skip-note">Révélez d'abord la réponse.</div>
            </div>

            <div id="phase-transition" style="display: none;">
                <div class="turn-info" id="phase-transition-title" style="color: white;">Transition</div>
                <button id="btn-phase-transition" class="btn btn-accent" onclick="requestTransition()">CONTINUER ➜</button>
            </div>

            <div id="ctrl-p2" style="display: none;">
                <div class="turn-info">Tour de : <span id="p2-team-name" style="color: white;"></span></div>
                <div class="grid-2">
                    <button class="btn btn-true" onclick="sendCmd('p2_resolve', true)">✅ VRAI</button>
                    <button class="btn btn-false" onclick="sendCmd('p2_resolve', false)">❌ FAUX</button>
                </div>
            </div>

            <div id="ctrl-p2-cat" style="display: none; flex-direction: column;">
                <div class="turn-info" style="margin-bottom: 5px;">Choix pour : <span id="p2-cat-team-name" style="color: white;"></span></div>
                <div class="grid-2" id="p2-cat-grid" style="gap: 8px;"></div>
            </div>

            <div id="ctrl-p3" style="display: none;">
                <div class="skip-note" style="margin-bottom: 10px;">Le texte se dévoile tant que vous appuyez.</div>
                <button class="btn btn-hold" id="btn-p3-anim">🪄 MAINTENIR POUR DÉVOILER</button>
            </div>
        </div>
    </div>

    <!-- OVERLAYS -->
    <div id="buzz-overlay" class="overlay">
        <div class="overlay-card">
            <div class="label" style="color: white; margin-bottom: 10px;">A BUZZÉ</div>
            <div class="overlay-title font-title" id="buzz-team-title">Équipe !</div>
            <div class="grid-2" style="margin-top: 25px;">
                <button class="btn btn-true" onclick="sendCmd('resolve', true)" style="padding: 20px 10px;">✅ VRAI</button>
                <button class="btn btn-false" onclick="sendCmd('resolve', false)" style="padding: 20px 10px;">❌ FAUX</button>
            </div>
        </div>
    </div>

    <!-- CORRECTION SCORES -->
    <div id="score-overlay" class="overlay">
        <div class="overlay-card">
            <div class="label" style="color: white; margin-bottom: 15px;">Ajustement manuel</div>
            <div id="score-list" style="overflow-y: auto; flex-grow: 1; display:flex; flex-direction:column; margin-bottom: 20px;"></div>
            <button class="btn btn-skip" onclick="document.getElementById('score-overlay').style.display='none'">Fermer</button>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="overlay-card">
            <div class="label" style="color: white; margin-bottom: 25px;">Paramètres de partie</div>
            <div style="display:flex; flex-direction:column; gap:20px; margin-bottom:30px;">
                <label style="display:flex; justify-content:space-between; align-items:center; color:white; font-size:1.2rem;">Phase 1 : <input type="number" id="master-cfg-p1" value="15" style="width:90px; margin:0; padding:10px;" onchange="sendSettings()"></label>
                <label style="display:flex; justify-content:space-between; align-items:center; color:white; font-size:1.2rem;">Phase 2 : <input type="number" id="master-cfg-p2" value="5" style="width:90px; margin:0; padding:10px;" onchange="sendSettings()"></label>
                <label style="display:flex; justify-content:space-between; align-items:center; color:white; font-size:1.2rem;">Phase 3 : <input type="number" id="master-cfg-p3" value="5" style="width:90px; margin:0; padding:10px;" onchange="sendSettings()"></label>
            </div>
            <button class="btn btn-skip" onclick="document.getElementById('settings-overlay').style.display='none'">Fermer</button>
        </div>
    </div>

    <!-- Lien vers le JS -->
    <script src="master.js"></script>
</body>
</html>
